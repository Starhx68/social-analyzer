version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: guobu-postgres
    restart: always
    environment:
      POSTGRES_DB: guobu
      POSTGRES_USER: guobu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Guobu@2025}
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - guobu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guobu -d guobu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: guobu-redis
    restart: always
    # 增加密码验证
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - guobu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: guobu-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Guobu@Minio2025}
    ports:
      # 修正端口映射：主机9090 -> 容器9000 (API)
      - "9090:9000"
      - "9091:9091"
    volumes:
      - ./minio_storage:/data
    networks:
      - guobu-network
    command: server /data --console-address ":9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    image: guobu-backend:latest
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: guobu-backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Database connection
      - DATABASE_URL=postgresql://guobu:${DB_PASSWORD:-Guobu@2025}@postgres:5432/guobu
      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # MinIO connection
      - MINIO_ENDPOINT=minio
      # 内部通信使用容器端口 9000
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-Guobu@Minio2025}
      - MINIO_BUCKET=guobu
      # Oracle Config
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_CONNECT_STRING=${ORACLE_CONNECT_STRING}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - guobu-network

  # 前端服务 (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: guobu-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - guobu-network
    dns:
      - 8.8.8.8
      - 114.114.114.114

networks:
  guobu-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
