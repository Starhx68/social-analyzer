version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:14-alpine
    container_name: guobu-postgres
    restart: always
    environment:
      POSTGRES_DB: guobu
      POSTGRES_USER: guobu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Guobu@2025}
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - guobu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guobu -d guobu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: guobu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - guobu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: guobu-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Guobu@Minio2025}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - guobu-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: guobu-backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Database connection (Overrides .env to use internal docker network)
      - DATABASE_URL=postgresql://guobu:${DB_PASSWORD:-Guobu@2025}@postgres:5432/guobu
      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # MinIO connection
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-Guobu@Minio2025}
      - MINIO_BUCKET=guobu
      # Oracle Config (Pass-through if needed, but env_file handles it)
      - ORACLE_USER=${ORACLE_USER}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - ORACLE_CONNECT_STRING=${ORACLE_CONNECT_STRING}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - guobu-network

  # 前端服务 (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: guobu-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - guobu-network

networks:
  guobu-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
